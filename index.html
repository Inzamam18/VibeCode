<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopWise AI — Smarter Shopping Decisions</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#FFFFFF',
              card: '#FFFFFF',
              border: '#E2E8F0',
              'border-subtle': '#F1F5F9',
            },
            ink: {
              900: '#111827',
              700: '#334155',
              500: '#64748B',
              400: '#94A3B8',
              300: '#CBD5E1',
            },
            accent: {
              DEFAULT: '#0B1F3A',
              hover: '#07162B',
              subtle: '#EAF1F8',
              border: '#D3DFEC',
              light: '#E8EEF5',
            },
            success: {
              DEFAULT: '#166534',
              bg: '#EEF7F3',
              border: '#C8E8D9',
            },
            warning: {
              DEFAULT: '#92400E',
              bg: '#FEF3C7',
              border: '#FDE68A',
            },
            danger: {
              DEFAULT: '#991B1B',
              bg: '#FEE2E2',
              border: '#FECACA',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #FFFFFF;
      color: #171717;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-container {
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 24px;
      padding-right: 24px;
    }
    @media (max-width: 640px) {
      .app-container {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    .page-fade {
      animation: pageFadeIn 180ms ease-out forwards;
    }
    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
    }
    @media (min-width: 640px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .product-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
    }
    .product-card:hover {
      transform: translateY(-3px);
      border-color: #D6D6D0;
      box-shadow: 0 10px 28px rgba(7, 22, 43, 0.08);
    }

    .product-image-container {
      position: relative;
      width: 100%;
      height: 210px;
      padding: 20px;
      background: #F7F9FC;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .product-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 200ms ease;
    }
    .product-card:hover .product-image-container img {
      transform: scale(1.02);
    }

    .product-actions-pinned {
      margin-top: auto;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F6F6F3;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #D8D8D2;
      border-radius: 4px;
    }

    .skeleton-box {
      background: linear-gradient(90deg, #F0F0EC 25%, #E6E6E0 50%, #F0F0EC 75%);
      background-size: 200% 100%;
      animation: skeletonWave 1.4s infinite linear;
    }
    @keyframes skeletonWave {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // ==========================================
    // BACKEND API SERVICE LAYER
    // ==========================================
    const API_BASE_URL = window.location.port === '8080' ? '/api' : 'http://localhost:8080/api';

    const apiService = {
      async getProducts(params = {}) {
        try {
          const query = new URLSearchParams();
          if (params.category && params.category !== 'all') query.append('category', params.category);
          if (params.brand) query.append('brand', params.brand);
          if (params.minPrice != null) query.append('minPrice', params.minPrice);
          if (params.maxPrice != null && params.maxPrice < 1000000) query.append('maxPrice', params.maxPrice);
          if (params.minRating != null) query.append('minRating', params.minRating);
          if (params.sort) query.append('sort', params.sort);

          const url = `${API_BASE_URL}/products${query.toString() ? '?' + query.toString() : ''}`;
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          return data.map(normalizeProduct);
        } catch (err) {
          console.warn('Failed to fetch products from backend; returning fallback products.', err);
          return [];
        }
      },

      async getProductById(id) {
        try {
          const res = await fetch(`${API_BASE_URL}/products/${id}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          return normalizeProduct(data);
        } catch (err) {
          console.warn(`Failed to fetch product ${id}:`, err);
          return null;
        }
      },

      async assistantSearch(query) {
        const res = await fetch(`${API_BASE_URL}/assistant/search`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        return await res.json();
      },

      async getWishlist(userId) {
        try {
          const res = await fetch(`${API_BASE_URL}/wishlist/${userId}`);
          if (!res.ok) return [];
          const data = await res.json();
          return data.map(normalizeProduct);
        } catch (err) {
          console.warn('Failed to fetch wishlist:', err);
          return [];
        }
      },

      async addToWishlist(userId, productId) {
        try {
          const res = await fetch(`${API_BASE_URL}/wishlist`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, productId })
          });
          return res.ok;
        } catch (err) {
          console.warn('Failed to add to wishlist:', err);
          return false;
        }
      },

      async removeFromWishlist(userId, productId) {
        try {
          const res = await fetch(`${API_BASE_URL}/wishlist/${productId}?userId=${encodeURIComponent(userId)}`, {
            method: 'DELETE'
          });
          return res.ok;
        } catch (err) {
          console.warn('Failed to delete from wishlist:', err);
          return false;
        }
      },

      async getReviews(productId) {
        try {
          const res = await fetch(`${API_BASE_URL}/products/${productId}/reviews`);
          if (!res.ok) return [];
          return await res.json();
        } catch (err) {
          console.warn(`Failed to get reviews for ${productId}:`, err);
          return [];
        }
      },

      async createReview(productId, reviewData) {
        const res = await fetch(`${API_BASE_URL}/products/${productId}/reviews`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reviewData)
        });
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        return await res.json();
      }
    };

    function normalizeProduct(p) {
      if (!p) return null;
      let specs = p.specifications;
      if (typeof specs === 'string') {
        try { specs = JSON.parse(specs); } catch { specs = {}; }
      }
      let features = p.features;
      if (typeof features === 'string') {
        try { features = JSON.parse(features); } catch { features = []; }
      }
      let pros = p.pros;
      if (typeof pros === 'string') {
        try { pros = JSON.parse(pros); } catch { pros = []; }
      }
      let cons = p.cons;
      if (typeof cons === 'string') {
        try { cons = JSON.parse(cons); } catch { cons = []; }
      }

      const numPrice = Number(p.price) || 0;
      const numDiscount = Number(p.discount || p.discount_percentage) || 0;
      const calculatedOriginalPrice = numDiscount > 0 ? Math.round(numPrice / (1 - numDiscount / 100)) : null;

      return {
        id: p.id,
        name: p.name || 'Product',
        brand: p.brand || 'Brand',
        category: (p.category || 'general').toLowerCase(),
        description: p.description || '',
        price: numPrice,
        originalPrice: p.originalPrice || calculatedOriginalPrice,
        discount: numDiscount,
        rating: Number(p.rating) || 4.5,
        reviewCount: Number(p.reviewCount || p.review_count) || 0,
        imageUrl: p.imageUrl || p.image_url || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80',
        specifications: specs || {},
        features: Array.isArray(features) ? features : [],
        pros: Array.isArray(pros) ? pros : [],
        cons: Array.isArray(cons) ? cons : [],
        availability: p.availability !== false
      };
    }

    function normalizeCat(cat) {
      if (!cat) return 'laptop';
      const c = cat.toLowerCase();
      if (c.includes('lap') || c.includes('mac') || c.includes('comput')) return 'laptop';
      if (c.includes('phone') || c.includes('mobile') || c.includes('cell') || c.includes('smart')) return 'smartphone';
      if (c.includes('head') || c.includes('ear') || c.includes('audio') || c.includes('bud')) return 'headphones';
      if (c.includes('watch')) return 'smartwatch';
      if (c.includes('tab') || c.includes('ipad')) return 'tablet';
      if (c.includes('cam')) return 'camera';
      if (c.includes('shoe') || c.includes('sneaker')) return 'shoes';
      if (c.includes('bag') || c.includes('pack')) return 'bags';
      return c;
    }

    // Fixed Demo User ID for Supabase & Spring Boot Wishlists
    const DEFAULT_USER_ID = '00000000-0000-0000-0000-000000000001';
    const getUserId = () => {
      let u = localStorage.getItem('shopwise_user_uuid');
      if (!u) {
        u = DEFAULT_USER_ID;
        localStorage.setItem('shopwise_user_uuid', u);
      }
      return u;
    };

    // ==========================================
    // MAIN REACT APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Navigation History Stack
      const [activeTab, setActiveTabState] = useState('home');
      const [navHistory, setNavHistory] = useState([]);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const setActiveTab = (nextTab) => {
        if (nextTab === activeTab) return;
        setNavHistory(prev => [...prev, activeTab].slice(-30));
        setActiveTabState(nextTab);
        setMobileMenuOpen(false);
        window.setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 0);
      };

      const goBack = () => {
        setNavHistory(prev => {
          if (!prev.length) { setActiveTabState('home'); return []; }
          const previous = prev[prev.length - 1];
          setActiveTabState(previous);
          return prev.slice(0, -1);
        });
        window.setTimeout(() => window.scrollTo({ top: 0, behavior: 'smooth' }), 0);
      };

      // Persistent User Session
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('shopwise_user') || 'null'); } catch { return null; }
      });
      const [favourites, setFavourites] = useState(() => {
        try { return JSON.parse(localStorage.getItem('shopwise_favs') || '[]'); } catch { return []; }
      });
      const [searchHistory, setSearchHistory] = useState(() => {
        try { return JSON.parse(localStorage.getItem('shopwise_history') || '[]'); } catch { return []; }
      });

      useEffect(() => { localStorage.setItem('shopwise_favs', JSON.stringify(favourites)); }, [favourites]);
      useEffect(() => { localStorage.setItem('shopwise_history', JSON.stringify(searchHistory)); }, [searchHistory]);

      // Product Catalog & Live Data State
      const [products, setProducts] = useState([]);
      const [catalogLoading, setCatalogLoading] = useState(true);
      const [backendOnline, setBackendOnline] = useState(true);

      // Query & Analysis State
      const [searchQuery, setSearchQuery] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [extractedReqs, setExtractedReqs] = useState(null);

      // Recommendation & Comparison State
      const [scoredProducts, setScoredProducts] = useState([]);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [productReviews, setProductReviews] = useState([]);
      const [reviewsLoading, setReviewsLoading] = useState(false);
      const [compareList, setCompareList] = useState([]);
      const [aiVerdict, setAiVerdict] = useState(null);
      const [isComparing, setIsComparing] = useState(false);

      // Filters
      const [filterCategory, setFilterCategory] = useState('all');
      const [filterMaxPrice, setFilterMaxPrice] = useState(200000);
      const [sortBy, setSortBy] = useState('rating');

      // Modals
      const [authModal, setAuthModal] = useState({ isOpen: false, isSignup: false, email: '', password: '', name: '' });
      const [modalData, setModalData] = useState({ isOpen: false, type: 'why_this', product: null, content: {} });
      const [reviewModal, setReviewModal] = useState({ isOpen: false, rating: 5, title: '', comment: '', submitting: false });

      // Demo Prompts
      const DEMO_SCENARIOS = [
        { label: 'Laptop for coding under ₹1.5L', query: 'I need a laptop for coding with 16GB RAM and dedicated GPU under ₹1,50,000.' },
        { label: 'Phone under ₹30,000', query: 'I need a phone under ₹30,000 with a great camera and battery life.' },
        { label: 'Headphones with ANC', query: 'I need wireless headphones under ₹30,000 for travel with active noise cancellation.' },
        { label: 'Smartwatch for outdoors', query: 'I want a rugged titanium smartwatch for sports and outdoor adventures.' }
      ];

      // Load products from backend on mount and sync wishlist
      const loadInitialData = useCallback(async () => {
        setCatalogLoading(true);
        try {
          const prods = await apiService.getProducts();
          if (prods && prods.length > 0) {
            setProducts(prods);
            setBackendOnline(true);
          }
          // Load wishlist items for current user
          const savedWishlist = await apiService.getWishlist(getUserId());
          if (savedWishlist && savedWishlist.length > 0) {
            const ids = savedWishlist.map(p => p.id);
            setFavourites(prev => Array.from(new Set([...prev, ...ids])));
          }
        } catch (e) {
          console.warn('Backend offline or error:', e);
          setBackendOnline(false);
        } finally {
          setCatalogLoading(false);
        }
      }, []);

      useEffect(() => {
        loadInitialData();
      }, [loadInitialData]);

      // Load reviews when selectedProduct changes
      useEffect(() => {
        if (selectedProduct && selectedProduct.id) {
          setReviewsLoading(true);
          apiService.getReviews(selectedProduct.id)
            .then(revs => setProductReviews(revs))
            .catch(() => setProductReviews([]))
            .finally(() => setReviewsLoading(false));
        }
      }, [selectedProduct]);

      // --- DISPATCH SEARCH TO SPRING BOOT AI ASSISTANT ---
      const handleRunSearch = async (queryOverride) => {
        const queryText = (queryOverride || searchQuery).trim();
        if (!queryText) return;

        setSearchQuery(queryText);
        setIsAnalyzing(true);
        setActiveTab('understanding');

        try {
          // Call Spring Boot /api/assistant/search endpoint
          const searchResult = await apiService.assistantSearch(queryText);

          if (searchResult && searchResult.success) {
            const reqs = searchResult.interpretedRequirements || {};
            const parsedReqs = {
              rawQuery: queryText,
              category: reqs.category || normalizeCat(queryText),
              maxBudget: reqs.maxPrice != null ? Number(reqs.maxPrice) : null,
              minBudget: reqs.minPrice != null ? Number(reqs.minPrice) : null,
              useCases: reqs.useCase ? [reqs.useCase] : (reqs.useCases || ['everyday use']),
              requiredFeatures: reqs.requiredFeatures?.length ? reqs.requiredFeatures : ['Optimal performance'],
              preferredFeatures: reqs.priorities?.length ? reqs.priorities : (reqs.preferredBrands || []),
              priorities: reqs.priorities || []
            };
            setExtractedReqs(parsedReqs);

            // Format ranked products from recommendation engine
            const formattedScored = (searchResult.rankedProducts || []).map(rp => ({
              product: normalizeProduct(rp.product),
              score: {
                totalScore: Math.round(rp.suitabilityScore || 80),
                matched: rp.strengths && rp.strengths.length > 0 ? rp.strengths : ['Meets key requirements', 'Reliable performance rating'],
                missing: rp.tradeoffs && rp.tradeoffs.length > 0 ? rp.tradeoffs : ['Standard configuration'],
                reason: rp.recommendationReason || `${rp.product.name} scored ${Math.round(rp.suitabilityScore)}% suitability for your criteria.`
              }
            }));

            setScoredProducts(formattedScored);
            setIsAnalyzing(false);
            return;
          }
        } catch (err) {
          console.warn('Assistant search failed on backend; using local parsing fallback.', err);
        }

        // Fallback local logic if backend search network issue
        setTimeout(() => {
          const lower = queryText.toLowerCase();
          const category = normalizeCat(lower);
          const reqs = {
            rawQuery: queryText,
            category,
            maxBudget: 60000,
            useCases: ['general use'],
            requiredFeatures: ['Verified performance'],
            preferredFeatures: ['Standard warranty'],
            priorities: []
          };
          setExtractedReqs(reqs);

          const matchingPool = products.filter(p => normalizeCat(p.category) === category);
          const pool = matchingPool.length > 0 ? matchingPool : products;
          const scored = pool.map(p => ({
            product: p,
            score: {
              totalScore: Math.round(p.rating * 20),
              matched: p.pros || ['Great hardware specifications'],
              missing: p.cons || ['Standard design'],
              reason: `${p.name} matches your requirement profile with a strong ${p.rating}/5 rating.`
            }
          })).sort((a, b) => b.score.totalScore - a.score.totalScore);

          setScoredProducts(scored);
          setIsAnalyzing(false);
        }, 500);
      };

      // Proceed from Understanding to Results Tab
      const computeRecommendations = () => {
        setActiveTab('results');
        if (extractedReqs) {
          const newHistory = {
            id: Date.now().toString(),
            query: extractedReqs.rawQuery,
            date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
            category: extractedReqs.category,
            topMatch: scoredProducts[0]?.product?.name || 'Category Best'
          };
          setSearchHistory(prev => [newHistory, ...prev.slice(0, 19)]);
        }
      };

      // Generate AI Verdict for Side-by-Side Comparison
      const generateAiVerdict = () => {
        if (compareList.length < 2) return;
        setIsComparing(true);

        setTimeout(() => {
          const topScored = [...compareList].sort((a, b) => b.rating - a.rating)[0];
          const bestValue = [...compareList].sort((a, b) => a.price - b.price)[0];
          setAiVerdict({
            winner: topScored,
            summary: `${topScored.name} delivers the most balanced overall value in this comparison group, offering top-tier hardware reliability, high user ratings (${topScored.rating}★), and excellent performance fit.`,
            whyWins: [
              `Directly satisfies ${extractedReqs?.useCases?.join(', ') || 'essential daily requirements'}`,
              `High consumer satisfaction: ${topScored.rating} / 5.0 (${topScored.reviewCount.toLocaleString()} verified reviews)`,
              `Competitive price of ₹${topScored.price.toLocaleString('en-IN')} with proven build quality`
            ],
            bestValue: bestValue,
            drawbackNote: topScored.cons?.[0] || 'Consider individual feature preferences before finalizing your purchase.'
          });
          setIsComparing(false);
        }, 600);
      };

      // Wishlist / Favourite Actions
      const toggleFavourite = async (productId) => {
        const isFav = favourites.includes(productId);
        const nextFavs = isFav ? favourites.filter(id => id !== productId) : [...favourites, productId];
        setFavourites(nextFavs);

        const userId = getUserId();
        if (isFav) {
          await apiService.removeFromWishlist(userId, productId);
        } else {
          await apiService.addToWishlist(userId, productId);
        }
      };

      const toggleCompare = (prod) => {
        if (compareList.some(p => p.id === prod.id)) {
          setCompareList(prev => prev.filter(p => p.id !== prod.id));
        } else {
          if (compareList.length >= 3) {
            alert('You can compare up to 3 products at a time.');
            return;
          }
          setCompareList(prev => [...prev, prod]);
        }
      };

      // Modals
      const openWhyThis = (product, score) => {
        setModalData({
          isOpen: true,
          type: 'why_this',
          product,
          content: {
            title: `Why ${product.name} Matches`,
            summary: score.reason || `${product.name} achieved a ${score.totalScore}% suitability index based on your stated parameters and budget.`,
            reasons: score.matched || []
          }
        });
      };

      const openWhyNotThis = (product, score) => {
        const top = scoredProducts[0]?.product;
        setModalData({
          isOpen: true,
          type: 'why_not_this',
          product,
          content: {
            title: `Trade-off Assessment: ${product.name}`,
            summary: `While ${product.name} is priced at ₹${product.price.toLocaleString('en-IN')}, here are the key trade-offs to keep in mind:`,
            missing: score.missing || []
          }
        });
      };

      // Handle Review Submission
      const handleReviewSubmit = async (e) => {
        e.preventDefault();
        if (!selectedProduct) return;
        setReviewModal(prev => ({ ...prev, submitting: true }));

        try {
          const created = await apiService.createReview(selectedProduct.id, {
            rating: reviewModal.rating,
            title: reviewModal.title || 'Customer Review',
            comment: reviewModal.comment,
            userId: getUserId()
          });
          setProductReviews(prev => [created, ...prev]);
          setReviewModal({ isOpen: false, rating: 5, title: '', comment: '', submitting: false });
        } catch (err) {
          alert('Failed to submit review. Please try again.');
          setReviewModal(prev => ({ ...prev, submitting: false }));
        }
      };

      // Discover Filtered Catalog
      const filteredDiscoverProducts = useMemo(() => {
        return products.filter(p => {
          if (filterCategory !== 'all' && normalizeCat(p.category) !== filterCategory) return false;
          if (p.price > filterMaxPrice) return false;
          return true;
        }).sort((a, b) => {
          if (sortBy === 'price_asc') return a.price - b.price;
          if (sortBy === 'price_desc') return b.price - a.price;
          if (sortBy === 'rating') return b.rating - a.rating;
          return b.rating - a.rating;
        });
      }, [products, filterCategory, filterMaxPrice, sortBy]);

      // Match Pill Badge Helper
      const MatchBadge = ({ score }) => {
        const isHigh = score >= 85;
        const isMed = score >= 70;
        const label = isHigh ? 'Excellent Match' : isMed ? 'Good Match' : 'Fair Match';
        const bg = isHigh ? 'bg-success-bg text-success border-success-border' : isMed ? 'bg-accent-subtle text-accent border-accent-border' : 'bg-warning-bg text-warning border-warning-border';

                  setUser(authUser);
                  localStorage.setItem('shopwise_user', JSON.stringify(authUser));
                  setAuthModal({ ...authModal, isOpen: false });
                }} className="space-y-3.5 text-xs">
                  {authModal.isSignup && (
                    <div>
                      <label className="font-medium text-ink-700 block mb-1">Full Name</label>
                      <input
                        type="text"
                        required
                        value={authModal.name}
                        onChange={(e) => setAuthModal({ ...authModal, name: e.target.value })}
                        className="w-full h-11 px-3 rounded-xl border border-app-border bg-app-bg text-xs focus:outline-none focus:border-accent"
                      />
                    </div>
                  )}
                  <div>
                    <label className="font-medium text-ink-700 block mb-1">Email</label>
                    <input
                      type="email"
                      required
                      value={authModal.email}
                      onChange={(e) => setAuthModal({ ...authModal, email: e.target.value })}
                      className="w-full h-11 px-3 rounded-xl border border-app-border bg-app-bg text-xs focus:outline-none focus:border-accent"
                    />
                  </div>
                  <div>
                    <label className="font-medium text-ink-700 block mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={authModal.password}
                      onChange={(e) => setAuthModal({ ...authModal, password: e.target.value })}
                      className="w-full h-11 px-3 rounded-xl border border-app-border bg-app-bg text-xs focus:outline-none focus:border-accent"
                    />
                  </div>

                  <button type="submit" className="w-full h-11 bg-ink-900 hover:bg-accent text-white font-semibold rounded-xl text-xs transition">
                    {authModal.isSignup ? 'Create Account' : 'Sign In'}
                  </button>

                  <div className="text-center pt-1">
                    <button
                      type="button"
                      onClick={() => setAuthModal({ ...authModal, isSignup: !authModal.isSignup })}
                      className="text-xs text-ink-500 hover:text-ink-900 font-medium"
                    >
                      {authModal.isSignup ? 'Already have an account? Sign In' : "Don't have an account? Sign Up"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              GLOBAL FOOTER
          ========================================== */}
          <footer className="bg-[#0B1F3A] text-ink-400 py-12 mt-auto border-t border-[#07162B]">
            <div className="app-container">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                <div className="md:col-span-2 space-y-2">
                  <p className="font-bold text-white text-sm">SHOPWISE <span className="text-accent-border">AI</span></p>
                  <p className="text-xs text-ink-300 max-w-sm leading-relaxed">
                    Smarter shopping decisions. Objective product discovery powered by transparent specification scoring and deterministic trade-off analysis.
                  </p>
                </div>
                <div>
                  <p className="text-[11px] font-bold text-ink-200 uppercase tracking-wider mb-2.5">Platform</p>
                  <div className="flex flex-col space-y-2 text-xs text-ink-300">
                    <button onClick={() => setActiveTab('discover')} className="text-left hover:text-white transition">Product Catalog</button>
                    <button onClick={() => setActiveTab('compare')} className="text-left hover:text-white transition">Side-by-Side Matrix</button>
                    <button onClick={() => setActiveTab('favourites')} className="text-left hover:text-white transition">Saved Gear</button>
                  </div>
                </div>
                <div>
                  <p className="text-[11px] font-bold text-ink-200 uppercase tracking-wider mb-2.5">Architecture</p>
                  <p className="text-xs text-ink-300 leading-relaxed">
                    100-Point Suitability Index · Spring Boot REST · PostgreSQL / Supabase Database
                  </p>
                </div>
              </div>

              <div className="border-t border-white/10 pt-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-[11px] text-ink-400">
                <span>© 2026 ShopWise AI. All rights reserved.</span>
                <span>Find What Fits You.</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
