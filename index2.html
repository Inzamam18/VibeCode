    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;

      color: #171717;
      -webkit-font-smoothing: antialiased;

    }

    /* Standardized Max Container */
    .app-container {
      max-width: 1280px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 24px;
      padding-right: 24px;
    }
    @media (max-width: 640px) {
      .app-container {
        padding-left: 16px;
        padding-right: 16px;
      }
    }

    /* Page View Transitions */
    .page-fade {
      animation: pageFadeIn 180ms ease-out forwards;
    }
    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Product Grid Layout */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 20px;
      align-items: stretch;
    }
    @media (min-width: 640px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1280px) {
      .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    /* Product Card Strict Geometry */
    .product-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 200ms ease, box-shadow 200ms ease, border-color 200ms ease;
    }
    .product-card:hover {
      transform: translateY(-3px);
      border-color: #D6D6D0;
      box-shadow: 0 10px 28px rgba(7, 22, 43, 0.08);
    }

    .product-image-container {
      position: relative;
      width: 100%;
      height: 210px;
      padding: 20px;
      background: #F7F9FC;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .product-image-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 200ms ease;
    }
    .product-card:hover .product-image-container img {
      transform: scale(1.02);
    }

    .product-actions-pinned {
      margin-top: auto;
    }

    /* Horizontal Pill Scroll Container (Hide Scrollbar) */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom Table Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F6F6F3;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #D8D8D2;
      border-radius: 4px;
    }

    /* Skeleton Loading Wave */
    .skeleton-box {
      background: linear-gradient(90deg, #F0F0EC 25%, #E6E6E0 50%, #F0F0EC 75%);
      background-size: 200% 100%;
      animation: skeletonWave 1.4s infinite linear;
    }
    @keyframes skeletonWave {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

        category: 'bags',
        price: 1899,
        originalPrice: 3299,
        rating: 4.5,
        reviewCount: 6700,
        imageUrl: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop',
        description: 'Ergonomic 30-liter laptop daypack featuring dedicated padded sleeves for 15.6" devices and weather-resistant ripstop polyester fabric.',
        features: ['30L Capacity', '15.6" Laptop Sleeve', 'Water Resistant Ripstop', 'Front Organizer Pocket', 'Ergonomic Back Mesh'],
        specifications: { capacity: '30 Liters', laptopCompartment: 'Up to 15.6"', material: 'Polyester Ripstop', weight: '450 g', waterResistant: 'Yes' },
        useCases: ['college', 'office', 'travel', 'daily commute'],
        pros: ['Sturdy ripstop construction against weather', 'Thick shoulder strap padding', 'Priced under ₹2,000'],
        cons: ['Side water bottle pocket is snug']
      }
    ];

    // Helper: Normalize Categories
    const normalizeCat = (cat) => {
      if (!cat) return 'laptop';
      const c = cat.toLowerCase();
      if (c.includes('lap') || c.includes('pc') || c.includes('computer')) return 'laptop';
      if (c.includes('phone') || c.includes('mobile')) return 'smartphone';
      if (c.includes('headphone') || c.includes('audio') || c.includes('ear') || c.includes('sound')) return 'headphones';
      if (c.includes('watch') || c.includes('band')) return 'smartwatch';
      if (c.includes('shoe') || c.includes('sneaker') || c.includes('footwear')) return 'shoes';
      if (c.includes('bag') || c.includes('pack')) return 'bags';
      return 'laptop';
    };

    // ==========================================
    // 2. DETERMINISTIC 100-POINT SCORING
    // ==========================================
    function calculateMatchScore(product, req) {
      if (!req) return { totalScore: 84, breakdown: {}, matched: ['Matches category criteria'], missing: [] };

      let matched = [];
      let missing = [];
      
      // 1. Budget (25 pts)
      let budgetScore = 25;
      if (req.maxBudget) {
        if (product.price <= req.maxBudget) {
          budgetScore = 25;
          matched.push(`Within budget (₹${product.price.toLocaleString('en-IN')} ≤ ₹${req.maxBudget.toLocaleString('en-IN')})`);
        } else {
          const overage = (product.price - req.maxBudget) / req.maxBudget;
          if (overage <= 0.15) {
            budgetScore = 15;
            missing.push(`Slightly exceeds target by ₹${(product.price - req.maxBudget).toLocaleString('en-IN')}`);
          } else {
            budgetScore = Math.max(0, Math.round(25 - (overage * 35)));
            missing.push(`Exceeds budget target by ₹${(product.price - req.maxBudget).toLocaleString('en-IN')}`);
          }
        }
      } else {
        matched.push('Fits target budget');
      }

      // 2. Features (30 pts)
      let featureScore = 0;
      const fullText = [
        product.name,
        product.description,
        ...product.features,
        ...Object.values(product.specifications || {})
      ].join(' ').toLowerCase();

      const reqFeatures = req.requiredFeatures || [];
      if (reqFeatures.length === 0) {
        featureScore = 30;
      } else {
        let matchedCount = 0;
        reqFeatures.forEach(f => {
          const key = f.toLowerCase();
          if (fullText.includes(key) || semanticCheck(key, fullText)) {
            matchedCount++;
            matched.push(`Includes ${f}`);
          } else {
            missing.push(`Lacks dedicated ${f}`);
          }
        });
        featureScore = Math.round((matchedCount / reqFeatures.length) * 30);
      }

      // 3. Use Case (20 pts)
      let useCaseScore = 0;
      const reqUseCases = req.useCases || [];
      if (reqUseCases.length === 0) {
        useCaseScore = 20;
      } else {
        let ucMatches = 0;
        const prodUseCases = (product.useCases || []).map(u => u.toLowerCase());
        reqUseCases.forEach(uc => {
          const key = uc.toLowerCase();
          if (prodUseCases.some(puc => puc.includes(key) || key.includes(puc)) || fullText.includes(key)) {
            ucMatches++;
            matched.push(`Optimized for ${uc}`);
          } else {
            missing.push(`Not specifically tuned for ${uc}`);
          }
        });
        useCaseScore = Math.round((ucMatches / reqUseCases.length) * 20);
      }

      // 4. Rating (10 pts)
      const ratingScore = Math.round(((product.rating || 4.0) / 5) * 10);

      // 5. Specs Completeness (10 pts)
      const specScore = Object.keys(product.specifications || {}).length >= 4 ? 10 : 7;

      // 6. Value Index (5 pts)
      let valueScore = 3;
      if (product.originalPrice && product.originalPrice > product.price) {
        const discount = ((product.originalPrice - product.price) / product.originalPrice) * 100;
        if (discount >= 15) valueScore = 5;
      }

      const totalScore = Math.min(100, Math.max(10, budgetScore + featureScore + useCaseScore + ratingScore + specScore + valueScore));

      return {
        totalScore,
        breakdown: { budgetScore, featureScore, useCaseScore, ratingScore, specScore, valueScore },
        matched,
        missing
      };
    }

    function semanticCheck(key, text) {
      if (key.includes('anc') && (text.includes('noise cancel') || text.includes('v1') || text.includes('noise sensor'))) return true;
      if (key.includes('battery') && (text.includes('hour') || text.includes('mah') || text.includes('70h') || text.includes('35h'))) return true;
      if (key.includes('16gb') && (text.includes('16gb') || text.includes('16 gb'))) return true;
      if (key.includes('gym') && (text.includes('lightweight') || text.includes('sweat') || text.includes('ip68') || text.includes('fit'))) return true;
      if (key.includes('travel') && (text.includes('anc') || text.includes('foldable') || text.includes('retina') || text.includes('carry'))) return true;
      if (key.includes('coding') && (text.includes('ryzen') || text.includes('i5') || text.includes('m1') || text.includes('16gb'))) return true;
      return false;
    }

    // ==========================================
    // 3. MAIN REACT APP
    // ==========================================
    function App() {

        { label: 'Phone for gaming', query: 'I need a smartphone under ₹30,000 with a good camera and high gaming performance.' },
        { label: 'Headphones for travel', query: 'I need headphones under ₹5,000 for gym and travel. ANC and long battery life are important.' },
        { label: 'Shoes under ₹3k', query: 'I need running shoes under ₹3,000 for daily running and gym workouts.' }
      ];

      // --- GEMINI SERVICE ---
      const callGemini = async (prompt) => {
        if (!geminiApiKey) return null;
        try {
          const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(geminiApiKey)}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { temperature: 0.2, responseMimeType: 'application/json' }
              })
            }
          );
          if (!response.ok) throw new Error(`Status ${response.status}`);
          const data = await response.json();
          const raw = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
          return raw.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();
        } catch (err) {
          console.warn('Gemini offline or errored; defaulting to local logic.', err);
          return null;
        }
      };

      const extractRequirementsWithGemini = async (query) => {
        const prompt = `You are a shopping requirement parser for ShopWise AI. Return ONLY JSON.
User query: "${query}"
Categories allowed: laptop, smartphone, headphones, smartwatch, shoes, bags.
Output format: {"category":"string","maxBudget":number|null,"useCases":["string"],"requiredFeatures":["string"],"preferredFeatures":["string"],"priorities":["string"]}`;
        const raw = await callGemini(prompt);
        if (!raw) return null;
        try {
          const parsed = JSON.parse(raw);
          return {
            rawQuery: query,
            category: normalizeCat(parsed.category || query),
            maxBudget: Number.isFinite(Number(parsed.maxBudget)) ? Number(parsed.maxBudget) : null,
            useCases: Array.isArray(parsed.useCases) && parsed.useCases.length ? parsed.useCases : ['everyday use'],
            requiredFeatures: Array.isArray(parsed.requiredFeatures) ? parsed.requiredFeatures : [],
            preferredFeatures: Array.isArray(parsed.preferredFeatures) ? parsed.preferredFeatures : [],
            priorities: Array.isArray(parsed.priorities) ? parsed.priorities : []
          };
        } catch { return null; }
      };

      // --- SEARCH DISPATCHER ---
      const handleRunSearch = async (queryOverride) => {

          const defaultBudget = cat === 'headphones' ? 5000 : cat === 'shoes' ? 3000 : cat === 'smartwatch' ? 8000 : cat === 'smartphone' ? 30000 : 60000;
          setExtractedReqs({
            ...geminiReqs,
            maxBudget: geminiReqs.maxBudget || defaultBudget,
            requiredFeatures: geminiReqs.requiredFeatures.length ? geminiReqs.requiredFeatures : ['Quality build']
          });
          setIsAnalyzing(false);
          return;
        }

        // Local Deterministic Extraction Fallback
        setTimeout(() => {
          const lower = queryText.toLowerCase();
          const category = normalizeCat(lower);
          let maxBudget = null;
          const budgetMatch = queryText.match(/(?:under|below|around|within|₹|rs\.?)[\s]*([\d,]+)/i);
          if (budgetMatch) {
            let parsed = parseInt(budgetMatch[1].replace(/,/g, ''), 10);
            if (parsed < 100) parsed *= 1000;
            maxBudget = parsed;
          }
          const useCases = [];
          if (lower.includes('coding') || lower.includes('programming')) useCases.push('coding');
          if (lower.includes('gym') || lower.includes('workout')) useCases.push('gym');
          if (lower.includes('travel') || lower.includes('flight') || lower.includes('commute')) useCases.push('travel');
          if (lower.includes('college') || lower.includes('student')) useCases.push('college');
          if (lower.includes('gaming')) useCases.push('gaming');

          const requiredFeatures = [];
          if (lower.includes('anc') || lower.includes('noise cancel')) requiredFeatures.push('ANC');
          if (lower.includes('16gb') || lower.includes('16 gb')) requiredFeatures.push('16GB RAM');
          if (lower.includes('battery')) requiredFeatures.push('Long Battery');

          const reqs = {
            rawQuery: queryText,
            category,
            maxBudget: maxBudget || (category === 'headphones' ? 5000 : category === 'shoes' ? 3000 : category === 'smartwatch' ? 8000 : category === 'smartphone' ? 30000 : 60000),
            useCases: useCases.length ? useCases : ['general use'],
            requiredFeatures: requiredFeatures.length ? requiredFeatures : ['Verified performance'],
            preferredFeatures: ['Standard warranty'],
            priorities: requiredFeatures
          };
          setExtractedReqs(reqs);
          setIsAnalyzing(false);
        }, 550);
      };

      // --- RECOMMENDATION COMPUTATION ---
      const computeRecommendations = () => {
        if (!extractedReqs) return;
        const matchingPool = products.filter(p => normalizeCat(p.category) === extractedReqs.category);
        const pool = matchingPool.length > 0 ? matchingPool : products;

        const scored = pool.map(p => ({

          score: calculateMatchScore(p, extractedReqs)

        const newHistory = {

        setSearchHistory(prev => [newHistory, ...prev.slice(0, 19)]);
      };

      // --- VERDICT GENERATOR ---
      const generateAiVerdict = async () => {

{
  "winnerId": "string",
  "summary": "2 sentences explaining why this product is the most balanced choice",
  "whyWins": ["point 1", "point 2", "point 3"],
  "drawbackNote": "trade-off note"
}
User requirements: ${JSON.stringify(extractedReqs || {})}
Products: ${JSON.stringify(compareList.map(p => ({ id: p.id, name: p.name, price: p.price, rating: p.rating, specs: p.specifications, pros: p.pros, cons: p.cons })))}`;

        const raw = await callGemini(prompt);

                  localStorage.setItem('shopwise_user', JSON.stringify(authUser));
                  setAuthModal({ ...authModal, isOpen: false });
                }} className="space-y-3.5 text-xs">
                  {authModal.isSignup && (
                    <div>
                      <label className="font-medium text-ink-700 block mb-1">Full Name</label>
                      <input
                        type="text"
                        required
                        value={authModal.name}
                        onChange={(e) => setAuthModal({ ...authModal, name: e.target.value })}
                        className="w-full h-11 px-3 rounded-xl border border-app-border bg-app-bg text-xs focus:outline-none focus:border-accent"
                      />
                    </div>
                  )}
                  <div>
                    <label className="font-medium text-ink-700 block mb-1">Email</label>
                    <input
                      type="email"
                      required
                      value={authModal.email}
                      onChange={(e) => setAuthModal({ ...authModal, email: e.target.value })}
                      className="w-full h-11 px-3 rounded-xl border border-app-border bg-app-bg text-xs focus:outline-none focus:border-accent"
                    />
                  </div>
                  <div>
                    <label className="font-medium text-ink-700 block mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={authModal.password}
                      onChange={(e) => setAuthModal({ ...authModal, password: e.target.value })}
                      className="w-full h-11 px-3 rounded-xl border border-app-border bg-app-bg text-xs focus:outline-none focus:border-accent"
                    />
                  </div>

                  {!authModal.isSignup && (
                    <div className="rounded-xl border border-app-border bg-app-bg p-3">
                      <div className="flex items-center justify-between gap-2">
                        <div>
                          <p className="text-[10px] font-bold uppercase tracking-wider text-ink-400">Demo Credentials</p>
                          <p className="text-[11px] text-ink-600 font-medium">demo@shopwise.ai</p>
                        </div>
                        <button
                          type="button"
                          onClick={() => setAuthModal({ ...authModal, email: 'demo@shopwise.ai', password: 'Demo@123', name: 'Inzamam' })}
                          className="px-2.5 py-1 bg-white border border-app-border text-ink-900 rounded text-[11px] font-semibold hover:bg-app-bg transition"
                        >
                          Use Demo
                        </button>
                      </div>
                    </div>
                  )}

                  <button type="submit" className="w-full h-11 bg-ink-900 hover:bg-accent text-white font-semibold rounded-xl text-xs transition">
                    {authModal.isSignup ? 'Create Account' : 'Sign In'}
                  </button>

                  <div className="text-center pt-1">
                    <button
                      type="button"
                      onClick={() => setAuthModal({ ...authModal, isSignup: !authModal.isSignup })}
                      className="text-xs text-ink-500 hover:text-ink-900 font-medium"
                    >
                      {authModal.isSignup ? 'Already have an account? Sign In' : "Don't have an account? Sign Up"}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              GLOBAL FOOTER
          ========================================== */}
          <footer className="bg-ink-900 text-ink-400 py-12 mt-auto">
            <div className="app-container">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                <div className="md:col-span-2 space-y-2">
                  <p className="font-bold text-white text-sm">SHOPWISE <span className="text-accent-border">AI</span></p>
                  <p className="text-xs text-ink-400 max-w-sm leading-relaxed">
                    Smarter shopping decisions. Objective product discovery powered by transparent specification scoring and deterministic trade-off analysis.
                  </p>
                </div>
                <div>
                  <p className="text-[11px] font-bold text-ink-300 uppercase tracking-wider mb-2.5">Platform</p>
                  <div className="flex flex-col space-y-2 text-xs text-ink-400">
                    <button onClick={() => setActiveTab('discover')} className="text-left hover:text-white transition">Product Catalog</button>
                    <button onClick={() => setActiveTab('compare')} className="text-left hover:text-white transition">Side-by-Side Matrix</button>
                    <button onClick={() => setActiveTab('favourites')} className="text-left hover:text-white transition">Saved Gear</button>
                  </div>
                </div>
                <div>
                  <p className="text-[11px] font-bold text-ink-300 uppercase tracking-wider mb-2.5">Architecture</p>
                  <p className="text-xs text-ink-400 leading-relaxed">
                    100-Point Suitability Index · Client-Side Heuristics · Optional Gemini API Integration
                  </p>
                </div>
              </div>

              <div className="border-t border-ink-700/60 pt-6 flex flex-col sm:flex-row justify-between items-center gap-2 text-[11px] text-ink-400">
                <span>© 2026 ShopWise AI. All rights reserved.</span>
                <span>Find What Fits You.</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
