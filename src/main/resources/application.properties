# ============================================================
# SmartShop AI Application Configuration
# ============================================================

spring.application.name=smartshop-backend
server.port=${PORT:8080}

# Database Configuration
# Default: Zero-config in-memory database in PostgreSQL compatibility mode
# When DB_URL is provided (e.g. Supabase), it automatically uses the external PostgreSQL database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartshop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
# Default: 'update' for instant local zero-login setup; set DDL_AUTO=none or validate when using Supabase in production
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Google Gemini AI Configuration
# If GEMINI_API_KEY is not set, SmartShop AI automatically uses the intelligent heuristic fallback extractor
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}

# CORS Configuration
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}

# Swagger / OpenAPI Documentation (accessible at http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging
logging.level.root=INFO
logging.level.com.smartshop=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
